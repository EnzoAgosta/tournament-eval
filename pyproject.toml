[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tournament-eval"
version = "0.1.0"
description = "Circular tournament evaluation framework for LLMs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai-slim>=1.107.0",
]

[project.optional-dependencies]
openai = [
    "openai>=2.43.0",
]
google = [
    "google-genai>=2.9.0",
]
anthropic = [
    "anthropic>=0.111.0",
]
bedrock = [
    "boto3>=1.43.33",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tournament_eval"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PT",
    "ARG",
    "PGH",
    "RUF",
]
ignore = ["SIM108"]


[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src"]
