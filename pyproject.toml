[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tournament-eval"
version = "0.1.0"
description = "Circular tournament evaluation framework for LLMs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["httpx>=0.28.1", "orjson>=3.11.9"]

[project.optional-dependencies]
openai = ["openai>=2.41.1"]
anthropic = ["anthropic>=0.109.1"]
bedrock = ["boto3>=1.43.29"]
ollama = ["ollama>=0.6.2"]
all = [
    "anthropic>=0.109.1",
    "boto3>=1.43.29",
    "ollama>=0.6.2",
    "openai>=2.41.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tournament_eval"]

[dependency-groups]
dev = [
    "anthropic>=0.109.1",
    "boto3>=1.43.29",
    "mypy>=2.1.0",
    "ollama>=0.6.2",
    "openai>=2.41.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PT",
    "ARG",
    "PGH",
    "RUF",
]
ignore = ["SIM108"]


[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src"]
